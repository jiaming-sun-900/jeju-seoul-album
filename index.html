<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Jeju &amp; Seoul</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 信封开场 -->
    <section class="screen envelope-screen">
      <div
        class="envelope"
        id="envelope"
        role="button"
        tabindex="0"
        aria-label="打开信封"
        aria-expanded="false"
      >
        <div class="envelope-flap"></div>
        <div class="envelope-body">
          <span class="envelope-label">To Zoe</span>
        </div>
      </div>
      <p class="envelope-hint">轻触，打开</p>
    </section>

    <!-- 开屏 -->
    <section class="screen hero">
      <h1 class="hero-title">Jeju &amp; Seoul</h1>
      <p class="hero-date">2026.8.13 — 2026.8.20</p>
    </section>

    <!-- 济州岛章节 -->
    <section class="screen chapter-title">
      <h2>Jeju</h2>
    </section>
    <section class="gallery" id="jeju-gallery"></section>

    <!-- 首尔章节 -->
    <section class="screen chapter-title">
      <h2>Seoul</h2>
    </section>
    <section class="gallery" id="seoul-gallery"></section>

    <!-- 结尾 -->
    <section class="screen ending">
      <p class="ending-line">I wish you were here</p>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
